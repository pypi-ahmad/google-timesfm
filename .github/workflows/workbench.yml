name: React and FastAPI workbench

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/react-fastapi-migration]

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra torch --extra server --extra app --group dev
      - run: uv run --no-sync ruff check src/timesfm_app diagnostic_app.py tests/test_app_api.py tests/test_app_store.py tests/test_app_jobs.py tests/test_app_migration.py tests/test_app_services.py tests/test_app_native.py tests/test_tracking_jobs.py tests/test_diagnostic_client.py
      - run: uv run --no-sync ty check src/timesfm_app
      - name: Test services and native process ownership without a GPU
        run: uv run --no-sync pytest -q tests/test_app_api.py tests/test_app_store.py tests/test_app_jobs.py tests/test_app_migration.py tests/test_app_services.py tests/test_app_native.py tests/test_tracking_jobs.py tests/test_diagnostic_client.py
      - run: uv run --no-sync python -m timesfm_app.openapi openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-openapi
          path: openapi.json

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: workbench-openapi
          path: .native
      - run: npm run generate:api
      - run: git diff --exit-code -- src/lib/generated/api.d.ts
      - run: npm run build
      - run: npm test

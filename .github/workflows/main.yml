name: Python package build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install project dependencies
        run: uv sync --extra torch --extra app --group dev
      - name: Build package
        run: uv run --with build python -m build
      - name: Lint current application code
        run: uv run ruff check streamlit_app.py src/timesfm3 tests/test_explorer.py tests/test_streamlit_app.py
      - name: Type-check current application code
        run: uv run ty check streamlit_app.py src/timesfm3/explorer.py tests/test_explorer.py tests/test_streamlit_app.py
      - name: Test current package
        run: uv run pytest -q tests src/timesfm3
